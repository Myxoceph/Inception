# server block: Defines a virtual server configuration
server
{
	# listen: Port and protocol to listen on
	# 443: HTTPS standard port
	# ssl: Enable SSL/TLS encryption
	listen 443 ssl;
	
	# server_name: Domain name this server block responds to
	# abakirca.42.fr: Your domain name (must match CN in SSL certificate)
	# Nginx uses this to determine which server block handles a request
	server_name abakirca.42.fr;

	# ssl_certificate: Path to SSL certificate file (public key)
	# /etc/nginx/certs/server.crt: Certificate generated by nginx.sh
	ssl_certificate /etc/nginx/certs/server.crt;
	
	# ssl_certificate_key: Path to private key file
	# /etc/nginx/certs/server.key: Private key generated by nginx.sh
	# This key must be kept secret and matches the certificate
	ssl_certificate_key /etc/nginx/certs/server.key;
	
	# ssl_protocols: Specify which TLS versions to allow
	# TLSv1.2: TLS version 1.2 (secure, widely supported)
	# TLSv1.3: TLS version 1.3 (most secure, modern browsers)
	# Older versions (TLSv1, TLSv1.1) are excluded for security
	ssl_protocols TLSv1.2 TLSv1.3;

	# root: Document root directory for this server
	# /var/www/wordpress: Where WordPress files are located
	# Nginx serves files from this directory
	root /var/www/wordpress;
	
	# index: Default files to serve when directory is requested
	# index.php: Try PHP file first (WordPress main entry point)
	# index.html: Fallback to HTML if PHP doesn't exist
	index index.php index.html;

	# location block: Configuration for URLs matching pattern
	# ~: Case-sensitive regex match
	# \.php$: Match URLs ending with .php
	# $: End of string anchor
	# This block handles all PHP file requests
	location ~ \.php$
	{
		# include: Include another configuration file
		# fastcgi.conf: Standard FastCGI parameters configuration
		# Provides variables like SCRIPT_FILENAME, QUERY_STRING, etc.
		include fastcgi.conf;
		
		# fastcgi_pass: Proxy PHP requests to FastCGI server
		# wordpress:9000: Hostname and port of PHP-FPM service
		# wordpress: Docker container name (resolved via Docker network)
		# 9000: Port where PHP-FPM listens
		# This forwards PHP execution to WordPress container
		fastcgi_pass wordpress:9000;
		
		# fastcgi_read_timeout: Max time (seconds) to wait for FastCGI response
		# 300: 5 minutes - allows long-running PHP scripts to complete
		fastcgi_read_timeout 300;
		
		# fastcgi_connect_timeout: Max time (seconds) to connect to FastCGI
		# 300: 5 minutes timeout for establishing connection
		fastcgi_connect_timeout 300;
		
		# fastcgi_send_timeout: Max time (seconds) for transmitting request
		# 300: 5 minutes timeout for sending request to FastCGI server
		fastcgi_send_timeout 300;
	}
}
